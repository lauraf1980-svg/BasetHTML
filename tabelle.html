<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabella</title>
</head>
<body>
    <!--colspan = 2(quanto vuoi espandere la cella occuperà 2 celle?)
    rowspan=2 (una cella che occupa 2 colonne)-->
    <table border="1" cellpadding="8" cellspacing="0">
        <caption>Vendite trimestrali</caption>
        <thead>
            <tr>
                <th>Trimestre</th>
                <th>Prodotto</th>
                <th>Prodotto</th>
                <th>Totale</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Primo trimestre</td>
                <td>15.000</td>
                <td>10.000</td>
                <td>25.000</td>
            </tr>
            <tr>
                <td>Secondo trimestre</td>
                <td>5.000</td>
                <td>10.000</td>
                <td>15.000</td>
            </tr>
            <tr>
                <td>Terzo trimestre</td>
                <td>7.000</td>
                <td>12.000</td>
                <td>19.000</td>
            </tr>
             <tr>
                <td>Quarto trimestre</td>
                <td>10.000</td>
                <td>20.000</td>
                <td>30.000</td>
            </tr>
            <tr></tr>
            <tr></tr>
        </tbody>
        <tfoot>
            <tr>
               <td>Totali</td>
                <td>30.000</td>
                <td>22.000</td>
                <td>39.000</td> 
            </tr>
        </tfoot>
    </table>
    
</body>
</html>
